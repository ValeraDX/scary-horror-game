name: "godot-ci export"

on:
  push:

env:
  GODOT_VERSION: 4.7.2
  PROJECT_PATH: .

jobs:
  export-windows:
    name: Windows 32 Bit Export
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot and Blender
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xz-utils wget

          mkdir -p \
            "$HOME/.config/godot" \
            "$HOME/.local/share/godot/export_templates"

          mv \
            "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          wget -nv \
            https://mirrors.dotsrc.org/blender/release/Blender3.6/blender-3.6.0-linux-x64.tar.xz

          tar -xf blender-3.6.0-linux-x64.tar.xz

          BLENDER_PATH="$PWD/blender-3.6.0-linux-x64/blender"

          test -x "$BLENDER_PATH"
          "$BLENDER_PATH" --version

          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender3_path = "$BLENDER_PATH"
          EOF

          godot --headless --editor --quit

      - name: Windows Build
        run: |
          mkdir -p build/win32

          cd "$PROJECT_PATH"

          godot \
            --headless \
            --verbose \
            --export-release \
            "Windows 32 Bit" \
            "build/win32/scary horror-win64.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-32-bit
          path: build/win32


