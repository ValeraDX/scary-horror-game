  export-android:
    name: Android Debug Export
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          apt-get update
          apt-get install -y --no-install-recommends blender
          blender --background --version
          test -x /usr/bin/blender

      - name: Configure Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"

          cp -a "/root/.local/share/godot/templates/${GODOT_VERSION}.stable" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender_path = "/usr/bin/blender"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          sdkmanager --version
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/build-tools/33.0.2"
          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/ndk"

      - name: Import project
        run: |
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender_path = "/usr/bin/blender"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

          godot \
            --headless \
            --path "$PROJECT_PATH" \
            --import \
            --audio-driver Dummy \
            --verbose

      - name: Verify project assets
        run: |
          find "$PROJECT_PATH" \
            -type f \
            \( -iname "*.wav" -o -iname "*.ogg" -o -iname "*.mp3" \) \
            -print

          find "$PROJECT_PATH" \
            -type f \
            \( -iname "*.png" \
            -o -iname "*.jpg" \
            -o -iname "*.jpeg" \
            -o -iname "*.webp" \
            -o -iname "*.svg" \) \
            -print

      - name: Android Debug Build
        run: |
          mkdir -p build/android

          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender_path = "/usr/bin/blender"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

          godot \
            --headless \
            --path "$PROJECT_PATH" \
            --verbose \
            --audio-driver Dummy \
            --export-debug \
            "Android" \
            "build/android/scary horror-android.apk"

      - name: Verify APK
        run: |
          test -f "build/android/scary horror-android.apk"
          ls -lh build/android

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: build/android
