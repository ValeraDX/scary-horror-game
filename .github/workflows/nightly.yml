  export-android:
    name: Android Debug Export
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Android, Godot, and Blender
        run: |
          apt-get update

          apt-get install -y --no-install-recommends \
            blender \
            xz-utils \
            wget \
            libx11-6 \
            libxext6 \
            libxi6 \
            libxrender1 \
            libxfixes3 \
            libxrandr2 \
            libxkbcommon0 \
            libsm6 \
            libice6 \
            libglib2.0-0 \
            libfontconfig1 \
            libgl1 \
            libegl1 \
            libdbus-1-3 \
            libpulse0

