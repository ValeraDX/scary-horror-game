            "$HOME/.config/godot" \
            "$HOME/.local/share/godot/export_templates"

          mv \
            "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          BLENDER_PATH="$(command -v blender)"

          test -x "$BLENDER_PATH"
          "$BLENDER_PATH" --background --version

          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender3_path = "$BLENDER_PATH"
          EOF

          godot \
            --headless \
            --path "$PROJECT_PATH" \
            --editor \
            --quit \
            --audio-driver Dummy

      - name: Verify project assets
        run: |
          echo "Audio files:"
          find "$PROJECT_PATH" \
            -type f \
            \( -iname "*.wav" -o -iname "*.ogg" -o -iname "*.mp3" \) \
            -print

          echo "Texture files:"
          find "$PROJECT_PATH" \
            -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" -o -iname "*.svg" \) \
            -print

      - name: Android Debug Build
        run: |
          mkdir -p build/android

          godot \
            --headless \
            --path "$PROJECT_PATH" \
            --verbose \
            --audio-driver Dummy \
            --export-debug \
            "Android" \
            "build/android/scary horror-android.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: build/android
