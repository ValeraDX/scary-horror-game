name: "godot-ci export"

on:
  push:

env:
  GODOT_VERSION: 4.7.2
  PROJECT_PATH: .

jobs:
  export-windows-32:
    name: Windows 32 Bit Export
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot and Blender
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            blender \
            xz-utils \
            wget \
            libx11-6 \
            libxext6 \
            libxi6 \
            libxrender1 \
            libxfixes3 \
            libxrandr2 \
            libxkbcommon0 \
            libsm6 \
            libice6 \
            libglib2.0-0 \
            libfontconfig1 \
            libgl1 \
            libegl1 \
            libdbus-1-3 \
            libpulse0

          mkdir -p \
            "$HOME/.config/godot" \
            "$HOME/.local/share/godot/export_templates"

          mv \
            "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          BLENDER_PATH="$(command -v blender)"

          test -x "$BLENDER_PATH"
          "$BLENDER_PATH" --background --version

          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender3_path = "$BLENDER_PATH"
          EOF

          godot --headless --editor --quit

      - name: Windows 32 Bit Build
        run: |
          mkdir -p build/win32
          cd "$PROJECT_PATH"

          godot \
            --headless \
            --verbose \
            --audio-driver Dummy \
            --export-release \
            "Windows 32 Bit" \
            "build/win32/scary horror-win64.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-32-bit
          path: build/win32


