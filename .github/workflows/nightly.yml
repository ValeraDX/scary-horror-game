name: "godot-ci export"

on:
  push:

env:
  GODOT_VERSION: 4.7.2
  PROJECT_PATH: .

jobs:
  export-windows-32:
    runs-on: ubuntu-26.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          apt-get update
          apt-get install -y --no-install-recommends blender
          blender --background --version
          test -x /usr/bin/blender

      - name: Configure Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender_path = "/usr/bin/blender"
          EOF

      - name: Export
        run: |
          mkdir -p build/win32
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender_path = "/usr/bin/blender"
          EOF
          godot --headless --audio-driver Dummy --path "$PROJECT_PATH" --verbose \
            --export-release "Windows 32 Bit" "build/win32/scary horror-win32.exe"

      - name: Verify
        run: |
          test -f "build/win32/scary horror-win32.exe"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-32
          path: build/win32/scary horror-win32.exe

