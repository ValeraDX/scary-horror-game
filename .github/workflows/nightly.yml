  export-android:
    name: Android Debug Export
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          sdkmanager --version
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platform-tools"
          ls -la "$ANDROID_HOME/build-tools"
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/ndk"

      - name: Install Blender
        run: |
          apt-get update
          apt-get install -y --no-install-recommends blender
          blender --background --version

      - name: Configure Godot
        run: |
          mkdir -p "$HOME/.config/godot"

          BLENDER_PATH="$(command -v blender)"

          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender3_path = "$BLENDER_PATH"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

      - name: Import project
        run: |
          godot \
            --headless \
            --path "$PROJECT_PATH" \
            --import \
            --audio-driver Dummy \
            --verbose

      - name: Verify project assets
        run: |
          find "$PROJECT_PATH" \
            -type f \
            \( -iname "*.wav" -o -iname "*.ogg" -o -iname "*.mp3" \) \
            -print


          find "$PROJECT_PATH" \
            -type f \
            \( -iname "*.png" \
            -o -iname "*.jpg" \
            -o -iname "*.jpeg" \
            -o -iname "*.webp" \
            -o -iname "*.svg" \) \
            -print


          git lfs ls-files

      - name: Android Debug Build
        run: |
          mkdir -p build/android

          godot \
            --headless \
            --path "$PROJECT_PATH" \
            --verbose \
            --audio-driver Dummy \
            --export-debug \
            "Android" \
            "build/android/scary horror-android.apk"

      - name: Verify APK
        run: |
          test -f "build/android/scary horror-android.apk"
          ls -lh build/android

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: build/android


