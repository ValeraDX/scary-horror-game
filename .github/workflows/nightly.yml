  export-android:
    runs-on: ubuntu-26.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          apt-get update
          apt-get install -y --no-install-recommends blender
          blender --background --version
          test -x /usr/bin/blender

      - name: Configure Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender_path = "/usr/bin/blender"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

      - name: Verify Android SDK
        run: |
          test -d /usr/lib/android-sdk
          test -x /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager
          test -d /usr/lib/android-sdk/platform-tools
          test -d /usr/lib/android-sdk/platforms/android-34
          test -d /usr/lib/android-sdk/build-tools/34.0.0
          test -d /usr/lib/jvm/java-17-openjdk-amd64
          test -f /root/debug.keystore
          java -version
          /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager --version

      - name: Verify Android assets
        run: |
          find "$PROJECT_PATH" -type f \( -iname "*.ogg" -o -iname "*.wav" -o -iname "*.mp3" \) | head -50
          find "$PROJECT_PATH" -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) | head -50

      - name: Export
        run: |
          mkdir -p build/android
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender_path = "/usr/bin/blender"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF
          godot --headless --audio-driver Dummy --path "$PROJECT_PATH" --verbose \
            --export-debug "Android" "build/android/scary horror-android.apk"

      - name: Verify
        run: |
          test -f "build/android/scary horror-android.apk"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: build/android/scary horror-android.apk
